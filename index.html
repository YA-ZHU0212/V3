<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SMART BRAIN Terminal</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- 掃描線 -->
    <div id="scanline"></div>

    <!-- 背景發光 -->
    <div id="backgroundGlow"></div>

    <!-- 主系統 -->
    <main id="terminal">

        <!-- Header -->
        <header id="header">

            <h1>SMART BRAIN</h1>

            <p>SECURITY TERMINAL</p>

        </header>

        <!-- Status -->
        <section id="statusPanel">

            <div class="statusItem">
                <span>STATUS</span>
                <strong id="status">BOOTING</strong>
            </div>

            <div class="statusItem">
                <span>DATABASE</span>
                <strong id="database">OFFLINE</strong>
            </div>

            <div class="statusItem">
                <span>USER</span>
                <strong id="user">UNKNOWN</strong>
            </div>

            <div class="statusItem">
                <span>DRIVER</span>
                <strong id="driver">SEARCHING</strong>
            </div>

        </section>

        <!-- Boot Terminal -->
        <section id="screen">

            <div id="terminalText"></div>

            <button id="accessButton">
                ACCESS FILE
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
