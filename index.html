<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMART BRAIN Terminal</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- 掃描線 -->
    <div id="scan"></div>

    <!-- 背景光 -->
    <div id="glow"></div>

    <!-- 主畫面 -->
    <main id="terminal">

        <!-- Header -->
        <header id="header">

            <h1>SMART BRAIN</h1>

            <p>SECURITY TERMINAL</p>

        </header>

        <!-- 狀態列 -->
        <aside id="statusPanel">

            <div class="statusRow">

                <span>STATUS</span>

                <strong id="statusValue">
                    BOOTING
                </strong>

            </div>

            <div class="statusRow">

                <span>DATABASE</span>

                <strong id="databaseValue">
                    OFFLINE
                </strong>

            </div>

            <div class="statusRow">

                <span>USER</span>

                <strong id="userValue">
                    UNKNOWN
                </strong>

            </div>

            <div class="statusRow">

                <span>DRIVER</span>

                <strong id="driverValue">
                    SEARCHING
                </strong>

            </div>

        </aside>

        <!-- 主內容 -->
        <section id="screen">

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
